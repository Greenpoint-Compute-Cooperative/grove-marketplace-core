[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 20_000
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
[profile.ci.fuzz]
runs = 1_000
